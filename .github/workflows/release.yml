# Builds git-desktools and publishes the bundle + signed updater manifest
# (latest.json) as a GitHub Release on this repo. Installed apps poll
# releases/latest/download/latest.json and update themselves from it. The release
# lives in the same repository, so the automatic GITHUB_TOKEN is sufficient.
#
# To release: node scripts/bump-version.mjs <x.y.z>, commit, then
#   git tag v<x.y.z> && git push origin v<x.y.z>
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    # DMG bundling drives Finder over AppleScript and can hang rather than fail.
    # Cap it so a hang costs an hour, not the six-hour default.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.10.1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "pnpm"

      # Only reads files, so a mismatched version fails in seconds, not after the Rust setup.
      - name: Check version consistency
        run: node scripts/bump-version.mjs --check

      # The release is named from tauri.conf.json but triggered by the tag. Refuse a
      # tag that disagrees, or latest.json would advertise the wrong number. Refs go
      # through env rather than ${{ }} interpolation so a crafted ref can't inject shell.
      - name: Derive version and check it matches the tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "value=$V" >> "$GITHUB_OUTPUT"
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "v$V" ]; then
            echo "::error::tag $REF_NAME does not match version v$V in src-tauri/tauri.conf.json"
            exit 1
          fi
          echo "version $V (ref $REF_TYPE $REF_NAME)"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Git identity for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main

      - name: Test
        run: |
          pnpm typecheck
          pnpm test
          cd src-tauri && cargo test

      - name: Build and publish
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ steps.version.outputs.value }}
          releaseName: git-desktools v${{ steps.version.outputs.value }}
          releaseBody: |
            git-desktools v${{ steps.version.outputs.value }} for macOS (universal).

            Install the `.dmg`, or let an existing install update itself.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          # `app` produces the .app.tar.gz + .sig the updater consumes; `dmg` is the
          # first-install download.
          args: --target universal-apple-darwin --bundles app,dmg
