[package]
name = "git-desktools"
version = "0.1.0"
description = "A lightweight cross-platform git GUI"
edition = "2021"

[lib]
name = "git_desktools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = { version = "0.21", default-features = false }
portable-pty = "0.9"
base64 = "0.22"
md5 = "0.7"
notify = "8"

[profile.dev.package."*"]
opt-level = 2
